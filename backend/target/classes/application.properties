server.port=8080
spring.datasource.url=jdbc:h2:file:./data/nexostore;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:local-development-only-secret-change-me-please-32chars}
app.cookie.secure=${COOKIE_SECURE:false}
app.jwt.expiration-ms=3600000
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
